<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMAT - Monitoring MAT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- CONTAINER UTAMA APLIKASI -->
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-md flex flex-col justify-between">
        
        <!-- HEADER -->
        <header class="bg-sky-700 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
            <div>
                <h1 class="font-extrabold text-base tracking-wide flex items-center gap-2">
                    <i data-lucide="droplet"></i> SIMAT Mobile
                </h1>
                <p class="text-[10px] text-sky-200">Monitoring & Pengukuran MAT</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Status Koneksi -->
                <div id="connectionStatus" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500 text-white shadow-sm">
                    <span id="statusText">Online</span>
                </div>
                <!-- Tombol Logout -->
                <button type="button" id="btnLogout" onclick="handleLogout()" class="hidden bg-sky-800 hover:bg-sky-900 text-white p-1.5 rounded-lg transition">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- SECTION LOGIN -->
        <div id="loginSection" class="p-6 my-auto">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="lock" class="w-8 h-8"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-800">Masuk Aplikasi</h2>
                <p class="text-xs text-slate-500">Masukkan kata sandi untuk mengakses formulir</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <input type="password" id="loginPassword" placeholder="Masukkan Password" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <p id="loginError" class="text-xs text-rose-500 text-center hidden">Password salah. Silakan coba lagi.</p>
                <button type="submit" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold text-sm rounded-xl shadow transition">
                    Masuk
                </button>
            </form>
        </div>

        <!-- MAIN APP CONTENT -->
        <main id="appContent" class="p-4 flex-1 space-y-4 hidden">
            
            <!-- CARD STATUS SINKRONISASI OFFLINE -->
            <div id="syncCard" class="hidden p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center justify-between text-amber-800">
                <div class="flex items-center gap-2">
                    <i data-lucide="refresh-cw" class="w-4 h-4 animate-spin"></i>
                    <span id="pendingCountText" class="text-xs font-medium">0 antrean data belum tersinkron</span>
                </div>
            </div>

            <!-- TABS NAVIGASI -->
            <div class="flex bg-slate-100 p-1 rounded-xl gap-1">
                <button type="button" id="tabFormBtn" onclick="switchTab('form')" class="flex-1 py-2 text-center font-semibold text-xs rounded-lg bg-sky-600 text-white shadow transition flex justify-center items-center gap-1.5">
                    <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Form Pengukuran
                </button>
                <button type="button" id="tabSummaryBtn" onclick="switchTab('summary')" class="flex-1 py-2 text-center font-semibold text-xs rounded-lg text-slate-500 hover:text-slate-800 transition flex justify-center items-center gap-1.5">
                    <i data-lucide="history" class="w-3.5 h-3.5"></i> Riwayat Data
                </button>
            </div>

            <!-- TAB 1: FORM PENGUKURAN -->
            <section id="tabFormSection" class="space-y-4">
                <form id="matForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Petugas</label>
                        <input type="text" id="namaPetugas" required class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Sumur</label>
                            <input type="text" id="namaSumur" required class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-sky-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Lokasi</label>
                            <input type="text" id="lokasi" required class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-sky-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Koordinat GPS</label>
                        <div class="flex gap-2">
                            <input type="text" id="koordinat" placeholder="Lat, Long" required readonly class="flex-1 px-3 py-2 border bg-slate-50 rounded-lg text-xs focus:ring-2 focus:ring-sky-500 outline-none">
                            <button type="button" onclick="getLocation()" class="px-3 py-2 bg-slate-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> GPS
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Cuaca</label>
                            <select id="cuaca" class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-sky-500 outline-none">
                                <option value="Cerah">Cerah</option>
                                <option value="Berawan">Berawan</option>
                                <option value="Hujan">Hujan</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Kondisi Artesis</label>
                            <select id="kondisiArtesis" class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-sky-500 outline-none">
                                <option value="Tidak Artesis">Tidak Artesis</option>
                                <option value="Artesis">Artesis</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Kondisi Fisik Sumur</label>
                        <div class="flex flex-wrap gap-3 text-xs pt-1">
                            <label class="flex items-center gap-1"><input type="checkbox" name="kondisiFisik" value="Baik" checked> Baik</label>
                            <label class="flex items-center gap-1"><input type="checkbox" name="kondisiFisik" value="Terkunci"> Terkunci</label>
                            <label class="flex items-center gap-1"><input type="checkbox" name="kondisiFisik" value="Rusak"> Rusak</label>
                            <label class="flex items-center gap-1"><input type="checkbox" name="kondisiFisik" value="Tersumbat"> Tersumbat</label>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Kedalaman Sumur (m)</label>
                            <input type="number" step="0.01" id="kedalamanSumur" required class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-sky-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tinggi Stick (m)</label>
                            <input type="number" step="0.01" id="tinggiStick" oninput="calculateCalculations()" required class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-sky-500 outline-none">
                        </div>
                    </div>

                    <div class="p-3 bg-sky-50 border border-sky-100 rounded-xl space-y-2">
                        <label class="block text-xs font-bold text-sky-800">Pengukuran Kedalaman MAT (m)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="number" step="0.01" id="p1" placeholder="P1" oninput="calculateCalculations()" required class="px-2 py-1.5 border rounded-lg text-xs text-center outline-none">
                            <input type="number" step="0.01" id="p2" placeholder="P2" oninput="calculateCalculations()" class="px-2 py-1.5 border rounded-lg text-xs text-center outline-none">
                            <input type="number" step="0.01" id="p3" placeholder="P3" oninput="calculateCalculations()" class="px-2 py-1.5 border rounded-lg text-xs text-center outline-none">
                        </div>
                        
                        <div class="pt-2 flex justify-between text-xs font-semibold text-slate-700 border-t border-sky-200">
                            <span>Rata-Rata: <strong id="avgDisplay" class="text-sky-700">0.00 m</strong></span>
                            <span>Total MAT: <strong id="totalMatDisplay" class="text-sky-700">0.00 m</strong></span>
                        </div>
                    </div>

                    <!-- FOTO DOKUMENTASI -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Dokumentasi (Maks. 5 Foto)</label>
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)" class="hidden">
                        <input type="file" id="fotoInput" accept="image/*" multiple onchange="handlePhotoUpload(event)" class="hidden">
                        
                        <div class="flex gap-2 mb-2">
                            <button type="button" onclick="triggerCamera()" class="flex-1 py-2 bg-slate-100 border border-slate-300 rounded-lg text-xs font-medium text-slate-700 flex items-center justify-center gap-1">
                                <i data-lucide="camera" class="w-3.5 h-3.5"></i> Kamera
                            </button>
                            <button type="button" onclick="triggerGallery()" class="flex-1 py-2 bg-slate-100 border border-slate-300 rounded-lg text-xs font-medium text-slate-700 flex items-center justify-center gap-1">
                                <i data-lucide="image" class="w-3.5 h-3.5"></i> Galeri
                            </button>
                        </div>

                        <!-- Preview Foto -->
                        <div id="photoPreview" class="grid grid-cols-5 gap-2"></div>
                    </div>

                    <button type="submit" id="btnSubmit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Simpan Measurement Data
                    </button>
                </form>
            </section>

            <!-- TAB 2: RIWAYAT DATA -->
            <section id="tabSummarySection" class="hidden space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-slate-700">Riwayat Pengukuran Terakhir</h3>
                    <button type="button" onclick="loadHistory()" class="text-[10px] text-sky-600 font-semibold flex items-center gap-1">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i> Refresh
                    </button>
                </div>
                <div id="historyList" class="space-y-2">
                    <p class="text-center py-4 text-slate-400 text-xs">Memuat data...</p>
                </div>
            </section>

        </main>

        <!-- FOOTER -->
        <footer class="p-3 text-center border-t border-slate-200 text-[10px] text-slate-400">
            &copy; <span id="currentYear"></span> SIMAT App. All rights reserved.
        </footer>
    </div>

    <!-- PEMANGGILAN LIBRARY LUCIDE -->
    <script src="./lucide.min.js"></script>

    <!-- SCRIPT LOGIKA APLIKASI -->
    <script>
        let compressedPhotos = [];
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwvKiwgBzGXPbB0YjwtQee57n7H9ucbUykynzhfekkOa1zPuBuIE1zdGaSt9U3bg75_/exec";

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            const currentYearEl = document.getElementById('currentYear');
            if (currentYearEl) {
                currentYearEl.textContent = new Date().getFullYear();
            }

            checkAuthStatus();
            updateOnlineStatus();
        });

        // --- AUTHENTICATION ---
        const APP_PASSWORD = "Bakungan@123";

        function checkAuthStatus() {
            const isLoggedIn = localStorage.getItem('simat_auth') === 'true';
            const loginSection = document.getElementById('loginSection');
            const appContent = document.getElementById('appContent');
            const btnLogout = document.getElementById('btnLogout');

            if (isLoggedIn) {
                loginSection.classList.add('hidden');
                appContent.classList.remove('hidden');
                btnLogout.classList.remove('hidden');
            } else {
                loginSection.classList.remove('hidden');
                appContent.classList.add('hidden');
                btnLogout.classList.add('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const inputPass = document.getElementById('loginPassword').value;
            const errorMsg = document.getElementById('loginError');

            if (inputPass === APP_PASSWORD) {
                localStorage.setItem('simat_auth', 'true');
                errorMsg.classList.add('hidden');
                document.getElementById('loginPassword').value = '';
                checkAuthStatus();
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function handleLogout() {
            if (confirm("Apakah Anda yakin ingin keluar dari aplikasi?")) {
                localStorage.removeItem('simat_auth');
                checkAuthStatus();
            }
        }

        // --- NAVIGATION TABS ---
        function switchTab(tab) {
            const formSection = document.getElementById('tabFormSection');
            const summarySection = document.getElementById('tabSummarySection');
            const formBtn = document.getElementById('tabFormBtn');
            const summaryBtn = document.getElementById('tabSummaryBtn');

            if (tab === 'form') {
                formSection.classList.remove('hidden');
                summarySection.classList.add('hidden');
                formBtn.className = "flex-1 py-2 text-center font-semibold text-xs rounded-lg bg-sky-600 text-white shadow transition flex justify-center items-center gap-1.5";
                summaryBtn.className = "flex-1 py-2 text-center font-semibold text-xs rounded-lg text-slate-500 hover:text-slate-800 transition flex justify-center items-center gap-1.5";
            } else {
                formSection.classList.add('hidden');
                summarySection.classList.remove('hidden');
                summaryBtn.className = "flex-1 py-2 text-center font-semibold text-xs rounded-lg bg-sky-600 text-white shadow transition flex justify-center items-center gap-1.5";
                formBtn.className = "flex-1 py-2 text-center font-semibold text-xs rounded-lg text-slate-500 hover:text-slate-800 transition flex justify-center items-center gap-1.5";
                loadHistory();
            }
        }

        function triggerCamera() { document.getElementById('cameraInput').click(); }
        function triggerGallery() { document.getElementById('fotoInput').click(); }

        // --- INDEXEDDB FOR OFFLINE STORAGE ---
        const dbName = "SIMAT_OfflineDB";
        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("queue")) {
                        db.createObjectStore("queue", { keyPath: "id" });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function saveOffline(data) {
            const db = await openDB();
            const tx = db.transaction("queue", "readwrite");
            tx.objectStore("queue").put(data);
            updateSyncStatusUI();
        }

        async function getOfflineQueue() {
            const db = await openDB();
            return new Promise((resolve) => {
                const tx = db.transaction("queue", "readonly");
                const req = tx.objectStore("queue").getAll();
                req.onsuccess = () => resolve(req.result);
            });
        }

        // --- ONLINE / OFFLINE STATUS ---
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        function updateOnlineStatus() {
            const statusText = document.getElementById('statusText');
            const connectionStatus = document.getElementById('connectionStatus');

            if (navigator.onLine) {
                statusText.textContent = "Online";
                connectionStatus.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500 text-white shadow-sm";
                syncOfflineData();
            } else {
                statusText.textContent = "Offline";
                connectionStatus.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-500 text-white shadow-sm";
            }
            updateSyncStatusUI();
        }

        async function updateSyncStatusUI() {
            const queue = await getOfflineQueue();
            const syncCard = document.getElementById('syncCard');
            const pendingCountText = document.getElementById('pendingCountText');

            if (queue.length > 0) {
                syncCard.classList.remove('hidden');
                pendingCountText.textContent = `${queue.length} antrean data belum tersinkron`;
            } else {
                syncCard.classList.add('hidden');
            }
        }

        // --- CALCULATIONS ---
        function calculateCalculations() {
            const p1 = parseFloat(document.getElementById('p1').value) || 0;
            const p2 = parseFloat(document.getElementById('p2').value) || 0;
            const p3 = parseFloat(document.getElementById('p3').value) || 0;
            const tinggiStick = parseFloat(document.getElementById('tinggiStick').value) || 0;

            let count = 0;
            if (document.getElementById('p1').value !== "") count++;
            if (document.getElementById('p2').value !== "") count++;
            if (document.getElementById('p3').value !== "") count++;

            const avg = count > 0 ? (p1 + p2 + p3) / count : 0;
            const totalMAT = avg - tinggiStick;

            document.getElementById('avgDisplay').textContent = `${avg.toFixed(2)} m`;
            document.getElementById('totalMatDisplay').textContent = `${totalMAT.toFixed(2)} m`;
        }

        // --- GEOLOCATION GPS ---
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        document.getElementById('koordinat').value = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                    },
                    (err) => {
                        if (err.code === err.PERMISSION_DENIED) {
                            if (confirm("GPS diblokir oleh pemutar/browser. Buka aplikasi di layar penuh untuk mengaktifkan GPS?")) {
                                window.open(window.location.href, '_blank');
                            }
                        } else {
                            alert("Gagal mengambil GPS: " + err.message);
                        }
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                alert("Geolocation tidak didukung pada browser ini.");
            }
        }

        // --- PHOTO COMPRESSION ---
        function handlePhotoUpload(event) {
            const files = Array.from(event.target.files);
            if (compressedPhotos.length + files.length > 5) {
                alert("Maksimal total foto yang dapat diunggah adalah 5 foto.");
                return;
            }

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1024;
                        let scale = MAX_WIDTH / img.width;
                        if (scale > 1) scale = 1;

                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        const base64 = canvas.toDataURL('image/jpeg', 0.7);
                        compressedPhotos.push({ data: base64, type: 'image/jpeg' });
                        renderPhotoPreview();
                    };
                };
                reader.readAsDataURL(file);
            });
            event.target.value = "";
        }

        function renderPhotoPreview() {
            const previewContainer = document.getElementById('photoPreview');
            previewContainer.innerHTML = '';
            compressedPhotos.forEach((photo, idx) => {
                const div = document.createElement('div');
                div.className = "relative group";
                div.innerHTML = `
                    <img src="${photo.data}" class="w-full h-12 object-cover rounded-lg border">
                    <button type="button" onclick="removePhoto(${idx})" class="absolute -top-1 -right-1 bg-rose-600 text-white rounded-full p-0.5 text-[8px]">✕</button>
                `;
                previewContainer.appendChild(div);
            });
        }

        function removePhoto(index) {
            compressedPhotos.splice(index, 1);
            renderPhotoPreview();
        }

        // --- SUBMIT DATA ---
        async function handleFormSubmit(event) {
            event.preventDefault();
            const selectedKondisiFisik = Array.from(document.querySelectorAll('input[name="kondisiFisik"]:checked')).map(cb => cb.value);

            const payload = {
                id: 'MAT-' + Date.now(),
                timestamp: new Date().toISOString(),
                namaPetugas: document.getElementById('namaPetugas').value,
                namaSumur: document.getElementById('namaSumur').value,
                lokasi: document.getElementById('lokasi').value,
                koordinat: document.getElementById('koordinat').value,
                cuaca: document.getElementById('cuaca').value,
                kondisiArtesis: document.getElementById('kondisiArtesis').value,
                kondisiFisik: selectedKondisiFisik,
                kedalamanSumur: document.getElementById('kedalamanSumur').value,
                tinggiStick: document.getElementById('tinggiStick').value,
                p1: document.getElementById('p1').value,
                p2: document.getElementById('p2').value,
                p3: document.getElementById('p3').value,
                photos: compressedPhotos
            };

            if (navigator.onLine) {
                submitToServer(payload);
            } else {
                await saveOffline(payload);
                alert("Koneksi Offline: Data tersimpan secara lokal.");
                resetForm();
            }
        }

        async function submitToServer(payload) {
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = `Memproses...`;

            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const res = await response.json();
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> Simpan Measurement Data`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                
                if (res.success) {
                    alert(res.message);
                    resetForm();
                    switchTab('summary');
                } else {
                    alert("Error: " + res.message);
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> Simpan Measurement Data`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                alert("Gagal terhubung ke Apps Script: " + (err.message || err));
            }
        }

        async function syncOfflineData() {
            if (!navigator.onLine) return;
            const queue = await getOfflineQueue();
            if (queue.length === 0) return;

            const db = await openDB();
            let successCount = 0;

            for (const item of queue) {
                try {
                    const response = await fetch(GAS_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(item)
                    });
                    const res = await response.json();
                    
                    if (res.success) {
                        successCount++;
                        const tx = db.transaction("queue", "readwrite");
                        tx.objectStore("queue").delete(item.id);
                    }
                } catch (e) {
                    console.error("Gagal sync item ID:", item.id, e);
                }
            }

            updateSyncStatusUI();
            if (successCount > 0) {
                alert(`Sinkronisasi Selesai: ${successCount} dari ${queue.length} data offline berhasil dikirim.`);
                loadHistory();
            }
        }

        function resetForm() {
            document.getElementById('matForm').reset();
            document.getElementById('photoPreview').innerHTML = '';
            document.getElementById('avgDisplay').textContent = "0.00 m";
            document.getElementById('totalMatDisplay').textContent = "0.00 m";
            compressedPhotos = [];
        }

        // --- LOAD RIWAYAT DATA ---
        async function loadHistory() {
            const list = document.getElementById('historyList');

            if (!navigator.onLine) {
                list.innerHTML = `<p class="text-center py-2 text-slate-400">Mode offline: Riwayat tidak tersedia.</p>`;
                return;
            }
            
            try {
                const response = await fetch(`${GAS_API_URL}?action=getHistory`);
                const data = await response.json();

                if (!data || data.length === 0) {
                    list.innerHTML = `<p class="text-center py-4 text-slate-400">Belum ada data tersimpan di Google Sheet.</p>`;
                    return;
                }

                list.innerHTML = data.map(item => {
                    let formattedDate = '-';
                    if (item.timestamp) {
                        const d = new Date(item.timestamp);
                        formattedDate = !isNaN(d.getTime()) ? d.toLocaleString('id-ID') : item.timestamp;
                    }

                    return `
                        <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center shadow-xs">
                            <div>
                                <p class="font-bold text-slate-700 text-xs">${item.namaSumur} <span class="font-normal text-slate-500">(${item.lokasi})</span></p>
                                <p class="text-[10px] text-slate-400 mt-0.5">Petugas: ${item.namaPetugas} | ${formattedDate}</p>
                            </div>
                            <div class="text-right">
                                <span class="font-extrabold text-sky-600 text-xs">Total: ${item.totalMAT} m</span>
                                <p class="text-[10px] text-slate-400">Avg: ${item.avgMAT} m</p>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                list.innerHTML = `<p class="text-center py-2 text-rose-500">Gagal memuat data: ${err.message || err}</p>`;
            }
        }

        // --- REGISTER SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered:', reg.scope))
                    .catch(err => console.error('SW Registration Failed:', err));
            });
        }
    </script>
</body>
</html>
